[project]
name = "hospital-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "reportlab>=4.1,<6.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db.seeds" = ["*.csv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.1",
]
